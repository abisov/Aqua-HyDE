# // █░░ █ █▀▄   █▀ █░█░█ █ ▀█▀ █▀▀ █░█
# // █▄▄ █ █▄▀   ▄█ ▀▄▀▄▀ █ ░█░ █▄▄ █▀█

# Lid switch handling (clamshell mode) for laptops
# When lid closes: disable laptop screen, workspaces move to external monitor
# When lid opens: re-enable laptop screen
# Note: Replace "eDP-1" with your laptop monitor name if different (check with: hyprctl monitors)
# These bindings are placed here instead of monitors.conf to prevent nwg-displays from overwriting them
bindl = , switch:on:Lid Switch, exec, ~/.local/bin/lid-handler.sh close
bindl = , switch:off:Lid Switch, exec, ~/.local/bin/lid-handler.sh open

# // █ █▄░█ █▀█ █░█ ▀█▀
# // █ █░▀█ █▀▀ █▄█ ░█░


#  Uncomment to enable // change to a preferred value
# 🔗 See https://wiki.hyprland.org/Configuring/Variables/#input
input {
    # kb_layout = us
    # follow_mouse = 1
    # sensitivity = 0
    # force_no_accel = 0
    # accel_profile = flat 
    # numlock_by_default = true

    # 🔗 See https://wiki.hyprland.org/Configuring/Variables/#touchpad
    touchpad {
        natural_scroll = no
    }

}



# 🔗 See https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
#     workspace_swipe = true
#     workspace_swipe_fingers = 3
}

# for window shallow similar to devour
misc {
    # enable_swallow = true
    # swallow_regex = (foot|kitty|allacritty|Alacritty|ghostty|Ghostty|org.wezfurlong.wezterm)
}

# Don't show update on first launch
ecosystem {
  # no_update_news = true
}

# Monitor hotplug handler - reapplies wallpaper when external monitor is connected
exec-once = ~/.local/bin/monitor-handler.sh

